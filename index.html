<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telemetry Progress Cards (HTML/CSS/jQuery)</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f3f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #007aff;
      --warn: #f97316;
      --critical: #ef4444;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      max-width: 1000px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      transition: border-color .25s ease, transform .25s ease;
      min-height: 185px;
    }

    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }

    .dot.warn { background: var(--warn); }
    .dot.critical { background: var(--critical); animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .5; transform: scale(1.15); }
    }

    .value-wrap {
      margin-top: 14px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .value { font-size: 36px; font-weight: 800; line-height: 1; }
    .unit {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
    }

    .util {
      margin-top: 18px;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .progress {
      margin-top: 8px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      transition: width .6s ease;
      background: var(--accent);
    }

    .progress-fill.warn { background: var(--warn); }
    .progress-fill.critical { background: var(--critical); }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, .95);
      color: #fff;
      padding: 16px;
      display: none;
      z-index: 2;
    }

    .overlay-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 700;
      opacity: .9;
    }

    .live { display: inline-flex; gap: 6px; align-items: center; }

    .sparkline {
      margin-top: 14px;
      height: 56px;
      width: 100%;
      display: flex;
      align-items: flex-end;
      gap: 3px;
    }

    .sparkline span {
      flex: 1;
      background: linear-gradient(180deg, #93c5fd, #1d4ed8);
      border-radius: 3px 3px 0 0;
      min-height: 8px;
      opacity: .95;
    }
  </style>
</head>
<body>
  <h1>Progress bars with hover telemetry (jQuery)</h1>

  <div class="grid" id="cardGrid"></div>

  <script>
    const telemetry = [
      { label: 'CPU Load', value: 74, unit: '%', trend: [35, 45, 38, 54, 61, 58, 74] },
      { label: 'Memory Usage', value: 86, unit: '%', trend: [62, 68, 73, 70, 81, 79, 86] },
      { label: 'OS Disk', value: 93, unit: '%', trend: [75, 80, 78, 83, 88, 91, 93] }
    ];

    function level(value) {
      if (value > 90) return 'critical';
      if (value > 80) return 'warn';
      return '';
    }

    function sparklineBars(trend) {
      const max = Math.max(...trend);
      return trend.map(n => {
        const h = Math.max(10, Math.round((n / max) * 56));
        return `<span style="height:${h}px"></span>`;
      }).join('');
    }

    telemetry.forEach(item => {
      const state = level(item.value);
      const html = `
        <div class="card" data-value="${item.value}">
          <div class="row">
            <span class="label">${item.label}</span>
            <span class="dot ${state}"></span>
          </div>

          <div class="value-wrap">
            <span class="value">${item.value}</span>
            <span class="unit">${item.unit}</span>
          </div>

          <div class="util">
            <span>Utilization</span>
            <span>${item.value}%</span>
          </div>

          <div class="progress">
            <div class="progress-fill ${state}" style="width:${item.value}%"></div>
          </div>

          <div class="overlay">
            <div class="overlay-top">
              <span>Live Telemetry</span>
              <span class="live"><span class="dot critical"></span>LIVE</span>
            </div>

            <div style="margin-top:20px; font-size:34px; font-weight:800; line-height:1;">
              ${item.value}<span style="font-size:16px; opacity:.7; margin-left:4px;">${item.unit}</span>
            </div>
            <div style="margin-top:6px; font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.7;">Real-time stream</div>

            <div class="sparkline">${sparklineBars(item.trend)}</div>
          </div>
        </div>`;
      $('#cardGrid').append(html);
    });

    $('.card').hover(
      function () {
        $(this).find('.overlay').stop(true, true).fadeIn(180);
      },
      function () {
        $(this).find('.overlay').stop(true, true).fadeOut(150);
      }
    );
  </script>
</body>
</html>
